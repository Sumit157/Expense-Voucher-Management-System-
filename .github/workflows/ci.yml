name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: expense_voucher_test
          MYSQL_USER: evoucher
          MYSQL_PASSWORD: evoucher-test
          MYSQL_ROOT_PASSWORD: root-test
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: mysql://evoucher:evoucher-test@127.0.0.1:3306/expense_voucher_test
      # Required by the Prisma datasource schema; `migrate deploy` never
      # creates it, but the env var must exist for schema resolution.
      SHADOW_DATABASE_URL: mysql://evoucher:evoucher-test@127.0.0.1:3306/expense_voucher_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
